name: Build Vertical Slice Package

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ui-tmp-warningfx

jobs:
  build:
    name: Build Unity Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Unity Package Manually
        run: |
          zip -r VerticalSlice_ErrorHandler.unitypackage Assets

      - name: Upload UnityPackage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VerticalSlicePackage
          path: VerticalSlice_ErrorHandler.unitypackage

      - name: Commit UnityPackage to Branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: feature/unity-package
          commit_message: "chore: auto-generate and commit UnityPackage artifact"
          file_pattern: VerticalSlice_ErrorHandler.unitypackage
          create_branch: true
